opacity=".55"/><rect x="192" y="138" width="6" height="6" fill="#000" opacity=".2"/></g><g class="bob" style="animation-delay:0.72s"><polygon points="112,120 120,112 144,112 136,120" fill="#ffd180" stroke="#000" stroke-width="2" stroke-linejoin="round"/><polygon points="136,120 144,112 144,136 136,144" fill="#c56200" stroke="#000" stroke-width="2" stroke-linejoin="round"/><rect x="112" y="120" width="24" height="24" fill="#ff9100" stroke="#000" stroke-width="2"/><rect x="116" y="124" width="6" height="6" fill="#fff" opacity=".55"/><rect x="126" y="134" width="6" height="6" fill="#000" opacity=".2"/></g>
