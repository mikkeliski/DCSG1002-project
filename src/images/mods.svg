<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" xmlns:c2pa="http://c2pa.org/manifest"><style>
.t{font-family:Impact,Haettenschweiler,'Arial Black','DejaVu Sans',sans-serif;font-weight:900;paint-order:stroke fill;stroke:#000;stroke-linejoin:round}
.s{font-family:'Arial Black',Arial,'DejaVu Sans',sans-serif;font-weight:900}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .8s ease-in-out infinite alternate}
.blink{animation:blink 1s steps(1) infinite}
.bounce{animation:bounce .6s ease-in-out infinite alternate}
.tw{animation:tw 1.2s ease-in-out infinite}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes blink{50%{opacity:0}}
@keyframes bounce{to{transform:translateY(-9px)}}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bob{animation:bob .7s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-8px)}}
.march{animation:march .6s linear infinite}@keyframes march{to{stroke-dashoffset:-22}}</style>
<defs>
  <pattern id="px" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#7c4dff"/><rect width="20" height="20" fill="#6a3de8"/><rect x="20" y="20" width="20" height="20" fill="#6a3de8"/>
  </pattern>
</defs>
<rect width="300" height="240" fill="url(#px)"/>
<g class="pulse"><text class="t" x="150" y="66" font-size="60" text-anchor="middle" fill="#ffe600" stroke-width="9" textLength="182" lengthAdjust="spacingAndGlyphs">1000+</text></g>
<text class="t" x="150" y="101" font-size="28" text-anchor="middle" fill="#fff" stroke-width="7" textLength="116" lengthAdjust="spacingAndGlyphs">MODS!!</text>
