<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240" xmlns:c2pa="http://c2pa.org/manifest"><style>
.t{font-family:Impact,Haettenschweiler,'Arial Black','DejaVu Sans',sans-serif;font-weight:900;paint-order:stroke fill;stroke:#000;stroke-linejoin:round}
.s{font-family:'Arial Black',Arial,'DejaVu Sans',sans-serif;font-weight:900}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .8s ease-in-out infinite alternate}
.blink{animation:blink 1s steps(1) infinite}
.bounce{animation:bounce .6s ease-in-out infinite alternate}
.tw{animation:tw 1.2s ease-in-out infinite}
@keyframes pulse{to{transform:scale(1.12)}}
@keyframes blink{50%{opacity:0}}
@keyframes bounce{to{transform:translateY(-9px)}}
@keyframes tw{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.spin{transform-box:view-box;transform-origin:150px 140px;animation:spin 8s linear infinite}
.shake{transform-box:fill-box;transform-origin:50% 100%;animation:shake .45s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
